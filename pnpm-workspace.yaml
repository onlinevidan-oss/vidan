allowBuilds:
  sharp: true
  unrs-resolver: true

# Шууд бус хамаарлуудын аюулгүй байдлын засвар.
# Бүгд build/lint хэрэгслийн дотор — ижил major дотор patch өсгөж байна.
# browserslist, baseline-browser-mapping-ийг яг тогтоосон нь санаатай:
# хамгийн сүүлийн хувилбар нь хэт шинэхэн (7 хоногт багтдаг) тул pnpm-ийн
# minimumReleaseAge хамгаалалт барьдаг. Засвар агуулсан, 14+ хоног болсон
# хувилбарыг сонгосон — хамгаалалтыг тойруулахгүйгээр эмзэг байдлыг хаана.
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml@4: ^4.3.2
  browserslist: 4.28.8
  baseline-browser-mapping: 2.11.20
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.28
